[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pluma-parkinsons-ai"
version = "0.1.0"
description = "Multi-omics Parkinson's disease AI training pipeline"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.45",
    "mofapy2>=0.7",
    "snfpy>=0.2",
    "cyvcf2>=0.30",
    "GEOparse>=2.0",
    "pysradb>=2.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "biopython>=1.83",
    "tqdm>=4.66",
    "pydeseq2>=0.4",
    "scikit-bio>=0.5",
]

[project.optional-dependencies]
training = [
    "torch>=2.6",
    # gemma4_unified checkpoints require transformers 5.10+; 4.x cannot load them.
    "transformers>=5.10",
    "peft>=0.20",
    # SFTConfig/SFTTrainer API used in src/training/train.py landed in trl 1.x.
    "trl>=1.10",
    "bitsandbytes>=0.48",
    "datasets>=4.0",
    "accelerate>=1.10",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
