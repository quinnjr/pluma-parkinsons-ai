# Where each stage reads and writes. `--data-root` on the CLI rebases all four.
paths:
  raw: "data/raw"
  processed: "data/processed"
  integrated: "data/integrated"
  instructions: "data/instructions"

# The cohort an end-to-end run is built from.
#
# GSE6613 (Scherzer et al., PNAS 2007, PMID:17215369) is whole-blood expression
# from 50 PD and 22 control subjects, public and unrestricted. It supplies the
# only *measured* molecular modality in a no-credentials run; everything listed
# under `simulated_modalities` is generated by src/acquisition/synthetic.py and
# is flagged as simulated in every downstream artefact.
#
# With PPMI access, drop entries from `simulated_modalities` and point the
# preprocessing stage at the real matrices instead.
cohort:
  geo_accession: "GSE6613"
  max_subjects: 40
  nhanes_cycle: "2017-2018"
  nhanes_metals_column: "LBXBPB"   # blood lead, ug/dL
  transcriptomics_top_variable_genes: 200
  simulated_modalities: [genomics, epigenomics, proteomics, metabolomics, microbiome]
  seed: 42

ppmi:
  base_url: "https://ida.loni.usc.edu/download/files"
  data_dir: "data/raw/ppmi"
  modalities: [genomics, transcriptomics, epigenomics, proteomics, metabolomics, microbiome, clinical]

geo:
  data_dir: "data/raw/geo"
  pd_search_terms:
    - "Parkinson's disease RNA-seq"
    - "Parkinson methylation"
    - "Parkinson microbiome 16S"
  max_results: 50

environmental:
  epa_aqs:
    base_url: "https://aqs.epa.gov/data/api"
    data_dir: "data/raw/epa"
  usgs_pesticides:
    data_dir: "data/raw/usgs"
  nhanes:
    data_dir: "data/raw/nhanes"
    cycles: ["2017-2018", "2019-2020"]
